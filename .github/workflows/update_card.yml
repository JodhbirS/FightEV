name: Refresh UFC Fight Card & Odds

on:
  schedule:
    # Runs every 12 hours on Thursdays, Fridays, and Saturdays (UTC)
    - cron: '0 */12 * * 4,5,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Fetch latest UFC odds & official bout order
        run: python backend/update_card.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/card.json
          git commit -m "Automated: update UFC fight card & odds" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
